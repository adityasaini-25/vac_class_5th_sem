<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>


        <label>Roll no. :</label>
        <input type="text" name="rollno" placeholder=" enter rollNo.">

        <br><br>



        <label>Student name :</label>
        <input type="text" name="firstname" placeholder=" Enter First Name">

        -

        <input type="text" name="lastname" placeholder=" Enter Last Name">

        <br><br>


        <label>Father's name :</label>
        <input type="text" name="fathername" placeholder="enters Father full name ">

        <br><br>



        <label>Date of birth :</label>

        <select name="day">
            <option>Day</option>
            <option>01</option>
            <option>02</option>
            <option>03</option>
            <option>04</option>
            <option>05</option>
            <option>06</option>
            <option>07</option>
            <option>08</option>
            <option>09</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
        </select>


        <select name="month">
            <option>Month</option>
            <option>01</option>
            <option>02</option>
            <option>03</option>
            <option>04</option>
            <option>05</option>
            <option>06</option>
            <option>07</option>
            <option>08</option>
            <option>09</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
        </select>

 

        <input type="text" name="year" placeholder="Year">



        <br><br>


        <label>Mobile no. :</label>

        <input type="text" value="+91" size="2" readonly>

        -

        <input type="tel" name="mobile" maxlength="10" placeholder="Mobile Number">

        <br><br>


        <label>Email id :</label>
        <input type="email" name="email">

        <br><br>


      
        <label>Password :</label>
        <input type="password" name="password">

        <br><br>


     
        <label>Gender :</label>

        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        

        <br><br>


        <label>Department :</label>

        <input type="checkbox" name="department" value="CSE">
        CSE

        <input type="checkbox" name="department" value="IT">
        IT

        <input type="checkbox" name="department" value="ECE">
        ECE

        <input type="checkbox" name="department" value="Civil">
        Civil

        <br><br>


       
        <label>Course :</label>

        <select name="course">

            <option>Select Current Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>B.Sc</option>
            <option>M.Tech</option>

        </select>

        <br><br>


    
        <label>City :</label>

        <input type="text" name="city">

        <br><br>


      
        <label>Address :</label>

        <br>

        <textarea name="address" rows="5" cols="50"></textarea>

        <br><br>


        <input type="submit" value="Register">

    </form>

</body>

</html>
