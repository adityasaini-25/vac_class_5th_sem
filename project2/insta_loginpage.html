<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Login</title>

    <link rel="stylesheet" href="insta.css">

</head>

<body>

    <div class="container">

        <!-- Login Box -->
        <div class="login-box">

            <h1 class="logo">Instagram</h1>

            <input class="input-box" type="text" placeholder="Phone number, username, or email">

            <input class="input-box" type="password" placeholder="Password">

            <button class="login-btn">
                Log in
            </button>

            <!-- OR -->
            <div class="or">

                <div class="line"></div>

                <span class="or-text">OR</span>

                <div class="line"></div>

            </div>

            <!-- Facebook -->
            <a href="../project1/facebook_loginpage.html" class="facebook">
                Log in with Facebook
            </a>

            <!-- Forgot password -->
            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>


        <!-- Signup -->
        <div class="signup-box">

            Don't have an account?
            <a href="#" class="signup">
                Sign up
            </a>

        </div>


        <!-- Get App -->
        <div class="get-app">

            <p>Get the app.</p>

            <div class="app-btn">

                <button>Google Play</button>

                <button>App Store</button>

            </div>

        </div>

    </div>

</body>

</html>
